<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09050d">
<title>心动粒子｜指尖互动版</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09050d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.top{position:fixed;top:calc(18px + env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none}
.kicker{font-size:10px;letter-spacing:.38em;color:#e8b6d0;opacity:.8}
h1{font-weight:300;font-size:clamp(21px,5vw,30px);letter-spacing:.14em;margin:8px 0;color:#fff1f7;text-shadow:0 0 24px #ff5da688}
.hint{position:fixed;left:16px;right:16px;bottom:calc(166px + env(safe-area-inset-bottom));text-align:center;font-size:12px;letter-spacing:.05em;color:#dcb6ca;opacity:.85;pointer-events:none}
.panel{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));padding:12px;border:1px solid #ffffff25;border-radius:18px;background:#1a101edb;backdrop-filter:blur(16px);box-shadow:0 12px 40px #0008}
.row{display:flex;gap:8px}input{min-width:0;flex:1;height:42px;border-radius:11px;border:1px solid #ffffff30;background:#ffffff0d;color:#fff;padding:0 12px;font-size:14px;outline:none}button{height:42px;border:1px solid #ffffff24;border-radius:11px;background:#ffffff12;color:#fff;padding:0 13px;font-size:13px;white-space:nowrap}button.primary{border:0;background:linear-gradient(135deg,#f05b9c,#a94bd0)}
.tools{display:flex;gap:8px;margin-top:9px}.tools button{flex:1}.tools button.active{border-color:#ff82b9;background:#e95d9b35}
.foot{text-align:center;color:#a88b9d;font-size:10px;letter-spacing:.16em;margin-top:8px}
@media(max-height:650px){.top{top:8px}.hint{display:none}.panel{bottom:8px;padding:9px}.foot{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header class="top"><div class="kicker">A LITTLE UNIVERSE OF LOVE</div><h1>把心意，聚成一颗心</h1></header>
<div class="hint" id="hint">用手指按住爱心拖动，粒子会随指尖散开</div>
<section class="panel">
 <div class="row"><input id="word" maxlength="16" value="LOVE" placeholder="输入组成爱心的文字"><button class="primary" id="apply">点亮爱心</button></div>
 <div class="tools"><button id="burst">粒子绽放</button><button id="pink" class="active">玫瑰粉</button><button id="gold">星河金</button></div>
 <div class="foot">TOUCH · FEEL · LOVE</div>
</section>
<script>
(()=>{
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),input=document.getElementById('word');
let W,H,D=1,ps=[],mode='pink',pointer=null,exploded=false,clock=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
function shape(){
 const n=Math.min(720,Math.max(300,Math.floor(W*H/950))),s=Math.min(W*.020,H*.014,9);
 const cx=W/2,cy=H*.465,out=[];
 // Sample filled heart area with a slight bias toward its outline.
 for(let i=0;i<n;i++){
  let t=rnd(0,Math.PI*2),r=Math.sqrt(Math.random());
  let x=16*Math.pow(Math.sin(t),3),y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
  out.push({x:cx+x*s*r,y:cy-y*s*r});
 }
 const str=input.value.trim()||'LOVE';
 ps=out.map((p,i)=>({x:rnd(0,W),y:rnd(0,H),tx:p.x,ty:p.y,ch:str[i%str.length],size:rnd(10,15),phase:rnd(0,6.28),vx:0,vy:0}));
}
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);shape()}
function reform(){exploded=false;ps.forEach(p=>{p.vx=0;p.vy=0});document.getElementById('burst').textContent='粒子绽放';document.getElementById('hint').textContent='用手指按住爱心拖动，粒子会随指尖散开'}
function burst(x=W/2,y=H*.46){exploded=true;ps.forEach(p=>{let dx=p.x-x,dy=p.y-y,l=Math.hypot(dx,dy)||1,f=rnd(3,8);p.vx=dx/l*f+rnd(-1,1);p.vy=dy/l*f+rnd(-1,1)});document.getElementById('burst').textContent='重新汇聚';document.getElementById('hint').textContent='轻触画面或点击“重新汇聚”，让爱心回来'}
function frame(){
 clock+=.016;ctx.clearRect(0,0,W,H);
 let g=ctx.createRadialGradient(W/2,H*.46,8,W/2,H*.46,Math.max(W,H)*.6);g.addColorStop(0,mode==='pink'?'#541b3a66':'#50391c66');g.addColorStop(1,'#09050d00');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(const p of ps){
  if(pointer){
   let dx=p.x-pointer.x,dy=p.y-pointer.y,d=Math.hypot(dx,dy)||1;
   if(d<115){let f=(1-d/115)*2.8;p.vx+=dx/d*f;p.vy+=dy/d*f}
  }
  if(!exploded){p.x+=(p.tx-p.x)*.065+p.vx;p.y+=(p.ty-p.y)*.065+p.vy;p.vx*=.84;p.vy*=.84;p.x+=Math.sin(clock*1.4+p.phase)*.12;p.y+=Math.cos(clock*1.2+p.phase)*.12}
  else{p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy*=.985;if(p.x<-30||p.x>W+30||p.y<-30||p.y>H+30){p.x=rnd(0,W);p.y=rnd(0,H)}}
  let sh=.5+.5*Math.sin(clock*2+p.phase),color=mode==='pink'?`rgba(255,${Math.floor(115+55*sh)},${Math.floor(175+50*sh)},.95)`:`rgba(255,${Math.floor(190+45*sh)},${Math.floor(110+55*sh)},.95)`;
  ctx.font=`${p.size}px Georgia,serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowBlur=13;ctx.shadowColor=color;ctx.fillStyle=color;ctx.fillText(p.ch,p.x,p.y);
 }
 ctx.shadowBlur=0;requestAnimationFrame(frame)
}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointer={x:e.clientX,y:e.clientY};if(exploded)reform()});
canvas.addEventListener('pointermove',e=>{if(pointer)pointer={x:e.clientX,y:e.clientY}});
function end(){pointer=null}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
document.getElementById('apply').onclick=()=>{let t=input.value.trim()||'LOVE';ps.forEach((p,i)=>p.ch=t[i%t.length]);reform()};
document.getElementById('burst').onclick=()=>exploded?reform():burst();
document.getElementById('pink').onclick=()=>{mode='pink';pink.classList.add('active');gold.classList.remove('active')};
document.getElementById('gold').onclick=()=>{mode='gold';gold.classList.add('active');pink.classList.remove('active')};
addEventListener('resize',resize);resize();frame();
})();
</script>
</body></html>
