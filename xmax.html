<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>圣诞夜，写给你</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;color:#fff6ee;font-family:"Songti SC","Noto Serif SC","STSong",serif;
background:radial-gradient(ellipse at 15% 20%,#7a1f2caa,transparent 50%),radial-gradient(ellipse at 50% 105%,#c9892a66,transparent 55%),linear-gradient(#06142a,#0c2740 55%,#12342f)}
canvas{position:fixed;inset:0;width:100%;height:100%}
.moon{position:fixed;top:calc(9% + env(safe-area-inset-top,0px));right:9%;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#ffe9b8 70%);box-shadow:0 0 30px 10px #ffe9b844,0 0 90px 40px #ffd08a18;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(8px)}}
.wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;box-sizing:border-box;z-index:2;transition:opacity 1.6s}
.wrap.out{opacity:0;pointer-events:none}
.letter{max-width:330px;text-align:center;line-height:2.1;font-size:18px;letter-spacing:.08em;text-shadow:0 0 12px #ffb36655;background:#06142a66;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #ffd16633;border-radius:26px;padding:28px 22px;box-shadow:0 0 50px #ff4d5e22}
.letter p{margin:0;min-height:1em}.big{font-size:20px;color:#ffd98a}
.start{cursor:pointer;text-align:center;font-size:19px;letter-spacing:.2em;animation:glow 2.6s ease-in-out infinite}
.start span{display:block;font-size:58px;margin-bottom:12px;animation:shk 2.2s infinite}@keyframes shk{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-10deg) scale(1.1)}85%{transform:rotate(10deg) scale(1.1)}}.start small{display:block;margin-top:14px;font-size:12px;opacity:.65;letter-spacing:.1em}
@keyframes glow{50%{opacity:.5}}
.btns{margin-top:22px;display:flex;gap:14px;justify-content:center;opacity:0;transition:opacity 1.4s}.btns.show{opacity:1}
button{font-family:inherit;font-size:17px;border-radius:999px;padding:11px 24px;cursor:pointer;letter-spacing:.1em;transition:transform .4s}
#yes{border:0;background:linear-gradient(135deg,#e5303f,#ff7b5c);color:#fff;box-shadow:0 0 22px #e5303f99;animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 34px #ff5a5a}}
#maybe{background:transparent;border:1px solid #ffffff55;color:#fff0e0}
.fin{opacity:0;transition:opacity 2.4s;position:fixed;left:0;right:0;bottom:calc(8% + env(safe-area-inset-bottom,0px));text-align:center;z-index:3;line-height:2.1;font-size:19px;letter-spacing:.1em;text-shadow:0 0 14px #e5303f}
.fin.show{opacity:1}.fin small{font-size:13px;opacity:.85;display:block}
#mute{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:14px;z-index:5;background:#ffffff14;border:1px solid #ffffff30;color:#fff;padding:6px 12px;font-size:14px;opacity:0}
.hide{display:none}
</style>
</head>
<body>
<div class="moon"></div>
<canvas id="c"></canvas>
<button id="mute">♪ 音乐</button>
<div class="wrap" id="wrap">
  <div class="start" id="start"><span>🎁</span>轻点，拆开这份圣诞礼物<small>建议打开声音 ♪</small></div>
  <div class="letter hide" id="letter"><div id="lines"></div>
    <div class="btns" id="btns"><button id="yes">我愿意 🎁</button><button id="maybe">再想想…</button></div>
  </div>
</div>
<div class="fin" id="fin">收到你的答案了<br>这个冬天，因为有你而温暖<small id="dt"></small><small>—— <span id="from"></span>　🎅</small></div>
<script>
// ✏️ 在这里修改名字
var TO="亲爱的你", FROM="爱你的我";
document.getElementById("from").textContent=FROM;
var d=new Date();document.getElementById("dt").textContent=d.getFullYear()+" · "+(d.getMonth()+1)+" · "+d.getDate()+"　我们的故事，从这个冬天开始";
var LINES=[TO+"：","","圣诞夜的雪悄悄落下，","街上的灯都亮了，","可我最想点亮的，","是你的笑容。","","遇见你，是今年最好的礼物。","我想把往后的每一个圣诞，","都和你一起过。","","所以——|big","你愿意成为我的圣诞礼物，|big","也成为我往后每个冬天的温暖吗？|big"];

var cv=document.getElementById("c"),g=cv.getContext("2d"),W,H,dpr=Math.min(devicePixelRatio||1,2);
function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
size();addEventListener("resize",size);
var R=Math.random,stars=[],snow=[],shoot=[],sparks=[],conf=[],bursts=[],heart=[],mode=0,t0=0,px=0,py=0,BC=["#ff4d5e","#ffd166","#4ade80","#60a5fa"];
for(var i=0;i<80;i++)stars.push({x:R(),y:R()*.6,z:R()*.8+.2,p:R()*6.28,s:R()*2+.6});
for(i=0;i<120;i++)snow.push({x:R(),y:R(),r:R()*2.4+.8,v:R()*.7+.3,p:R()*6.28});
for(var k=0;k<96;k++){var a=k/96*6.2832;heart.push({tx:16*Math.pow(Math.sin(a),3),ty:-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a)),x:R()*innerWidth,y:R()*innerHeight,r:R()*1.4+1.5})}
function spark(x,y){for(var i=0;i<2;i++)sparks.push({x:x,y:y,vx:(R()-.5)*1.2,vy:R()*.8+.2,l:1,r:R()*2+1})}
addEventListener("pointermove",function(e){spark(e.clientX,e.clientY);px=(e.clientX/W-.5);py=(e.clientY/H-.5)});
addEventListener("pointerdown",function(e){for(var i=0;i<8;i++)spark(e.clientX,e.clientY)});
var FC=["255,90,100","255,214,102","110,230,150"];
function burst(){var x=R()*W*.8+W*.1,y=R()*H*.4+H*.08,c=FC[Math.floor(R()*3)];
  for(var i=0;i<46;i++){var a=R()*6.28,v=R()*3+1;bursts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:c})}}
function dot(x,y,r,c,b){g.shadowColor=c;g.shadowBlur=b;g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,6.2832);g.fill();g.shadowBlur=0}
function tree(x,h,ts){var w=h*.55,y=H-4;g.fillStyle="#0d4a2e";
  for(var j=0;j<3;j++){var tw=w*(1-j*.22),ty=y-h*.18-j*h*.27;g.beginPath();g.moveTo(x,ty-h*.4);g.lineTo(x-tw/2,ty);g.lineTo(x+tw/2,ty);g.fill()}
  g.fillStyle="#5a3a1e";g.fillRect(x-h*.04,y-h*.18,h*.08,h*.18);
  dot(x,y-h*.98,h*.05,"#ffd166",16);
  for(j=0;j<12;j++){var yy=y-h*.25-(j/12)*h*.6,xx=x+Math.sin(j*2.3)*(h*.24*(1-(j/12)*.85));
    dot(xx,yy,2.4,BC[j%4],Math.sin(ts/500+j)>0?10:2)}}

function frame(ts){
  g.clearRect(0,0,W,H);aurora(ts);sleigh(ts);
  stars.forEach(function(s){var al=.3+.7*Math.abs(Math.sin(ts/1000*s.s+s.p));
    g.fillStyle="rgba(255,244,225,"+al*(mode?.5:1)+")";g.beginPath();g.arc(s.x*W-px*12*s.z,s.y*H-py*12*s.z,s.z*1.4,0,6.2832);g.fill()});
  if(R()<.007)shoot.push({x:R()*W*.8+W*.2,y:R()*H*.3,l:1});
  shoot=shoot.filter(function(s){var gr=g.createLinearGradient(s.x,s.y,s.x+100,s.y-55);
    gr.addColorStop(0,"rgba(255,235,200,"+s.l+")");gr.addColorStop(1,"rgba(255,235,200,0)");
    g.strokeStyle=gr;g.lineWidth=1.6;g.beginPath();g.moveTo(s.x,s.y);g.lineTo(s.x+100,s.y-55);g.stroke();
    s.x-=7;s.y+=4;s.l-=.016;return s.l>0});
  tree(W*.1,Math.min(H*.3,170),ts);tree(W*.9,Math.min(H*.24,140),ts+900);
  // 彩灯串
  var n=12,ty=env0();g.strokeStyle="rgba(255,255,255,.25)";g.lineWidth=1;g.beginPath();
  for(var q=0;q<=n;q++){var gx=q/n*W,gy=ty+Math.sin(q/n*Math.PI*4)*7+10;q?g.lineTo(gx,gy):g.moveTo(gx,gy)}g.stroke();
  for(q=0;q<=n;q++){var bx=q/n*W,by=ty+Math.sin(q/n*Math.PI*4)*7+10;dot(bx,by+5,3.4,BC[q%4],Math.sin(ts/450+q*1.7)>-.2?14:3)}
  // 飘雪
  g.fillStyle="rgba(255,255,255,.85)";
  snow.forEach(function(s){var x=(s.x*W+Math.sin(ts/1200+s.p)*18-px*20*s.r/3+W)%W;g.globalAlpha=.4+s.r/5;g.beginPath();g.arc(x,s.y*H,s.r,0,6.2832);g.fill();
    s.y+=s.v/H*1.3;if(s.y>1.02){s.y=-.02;s.x=R()}});g.globalAlpha=1;
  sparks=sparks.filter(function(s){g.fillStyle="rgba(255,214,120,"+s.l+")";g.beginPath();g.arc(s.x,s.y,s.r*s.l,0,6.2832);g.fill();
    s.x+=s.vx;s.y+=s.vy;s.l-=.025;return s.l>0});
  if(mode){
    var sc=Math.min(W,H*.8)/46,cx=W/2,cy=H*.38,e=Math.min((ts-t0)/4500,1);e=1-Math.pow(1-e,3);
    var bt=1+.035*Math.sin(ts/380)*e;
    heart.forEach(function(h){h.cx=h.x+(cx+h.tx*sc*bt-h.x)*e;h.cy=h.y+(cy+h.ty*sc*bt-h.y)*e});
    g.shadowColor="#ff4d5e";g.shadowBlur=16;g.strokeStyle="rgba(255,120,130,"+(.15+.6*e)+")";g.lineWidth=1.2;
    g.beginPath();heart.forEach(function(h,i){i?g.lineTo(h.cx,h.cy):g.moveTo(h.cx,h.cy)});g.closePath();g.stroke();
    if(e>.9){g.fillStyle="rgba(229,48,63,.12)";g.fill()}
    heart.forEach(function(h,i){g.fillStyle="rgba(255,230,190,"+(.65+.35*Math.sin(ts/400+i))+")";g.beginPath();g.arc(h.cx,h.cy,h.r,0,6.2832);g.fill()});
    g.shadowBlur=0;
    if(e>.95){if(R()<.012)burst();if(R()<.1)conf.push({x:R()*W,y:-10,v:R()*1+.7,p:R()*6.28,s:R()*4+3,c:FC[Math.floor(R()*3)]})}
    conf=conf.filter(function(p){g.save();g.translate(p.x+Math.sin(ts/700+p.p)*20,p.y);g.rotate(ts/400+p.p);
      g.fillStyle="rgba("+p.c+",.8)";g.fillRect(-p.s,-p.s/3,p.s*2,p.s*.66);g.restore();p.y+=p.v;return p.y<H+20});
    bursts=bursts.filter(function(b){g.fillStyle="rgba("+b.c+","+b.l+")";g.beginPath();g.arc(b.x,b.y,1.8,0,6.2832);g.fill();
      b.x+=b.vx;b.y+=b.vy;b.vy+=.04;b.vx*=.985;b.l-=.012;return b.l>0});
  }
  requestAnimationFrame(frame)}
function env0(){return 4}
function aurora(ts){["80,230,170","255,120,150","120,170,255"].forEach(function(c,k){var gr=g.createLinearGradient(0,H*.04,0,H*.42);gr.addColorStop(0,"rgba("+c+",0)");gr.addColorStop(.5,"rgba("+c+","+(.11+.04*Math.sin(ts/2000+k))+")");gr.addColorStop(1,"rgba("+c+",0)");g.fillStyle=gr;g.beginPath();g.moveTo(0,H*.42);for(var x=0;x<=W;x+=24)g.lineTo(x,H*(.12+k*.05)+Math.sin(x/90+ts/1800+k*2)*H*.04);g.lineTo(W,H*.42);g.closePath();g.fill()})}
var sl=null;
function sleigh(ts){if(!sl&&R()<.002)sl={x:-120,y:H*(.14+R()*.14)};if(!sl)return;sl.x+=1.7;var y=sl.y+Math.sin(sl.x/60)*10;g.font="28px serif";g.fillStyle="#fff";g.fillText("🦌🦌🛷🎅",sl.x,y);if(R()<.5)sparks.push({x:sl.x,y:y+4,vx:-.6,vy:.3,l:1,r:R()*2+1});if(sl.x>W+40)sl=null}
requestAnimationFrame(frame);

// 圣诞音乐盒：《Jingle Bells》（公版曲）
var ac,on=true,step=0,
 C=[261.6,329.6,392,523.3],F=[174.6,220,261.6,349.2],G=[196,246.9,293.7,392],CH=[C,C,C,C,F,C,G,G],
 E=329.6,Gn=392,Cn=261.6,Dn=293.7,Fn=349.2,
 seq=[[E,2],[E,2],[E,4],[E,2],[E,2],[E,4],[E,2],[Gn,2],[Cn,3],[Dn,1],[E,8],[Fn,2],[Fn,2],[Fn,3],[Fn,1],[Fn,2],[E,2],[E,2],[E,1],[E,1],[E,2],[Dn,2],[Dn,2],[E,2],[Dn,4],[Gn,4]],M={};
(function(){var p=0;seq.forEach(function(n){M[p]=n[0];p+=n[1]})})();
function note(f,t,a,len){a=a||.08;len=len||1.6;var o=ac.createOscillator(),v=ac.createGain();o.type="sine";o.frequency.value=f*2;
  v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(a,t+.015);v.gain.exponentialRampToValueAtTime(.001,t+len);
  o.connect(v);v.connect(ac.destination);o.start(t);o.stop(t+len+.1)}
function bell(t){var b=ac.createBuffer(1,ac.sampleRate*.06,ac.sampleRate),dd=b.getChannelData(0);for(var j=0;j<dd.length;j++)dd[j]=(R()*2-1)*(1-j/dd.length);
  var s=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain();f.type="highpass";f.frequency.value=8000;v.gain.value=.05;s.buffer=b;s.connect(f);f.connect(v);v.connect(ac.destination);s.start(t)}
function tick1(){var i=step%8,t=ac.currentTime+.05,c=CH[Math.floor(step/8)%8];
  if(i==0){c.slice(1,4).forEach(function(f){note(f/2,t,.03,2.2)});note(c[0]/4,t,.1,1.2)}
  if(i==4)note(c[0]/4,t,.06,1);
  if(M[step%64])note(M[step%64],t,.1,1.4);
  if(i%2==0)bell(t);step++}
var SN=[[392,3],[440,1],[392,2],[329.6,6],[392,3],[440,1],[392,2],[329.6,6],[587.3,4],[587.3,2],[493.9,6],[523.3,4],[523.3,2],[392,6],[440,4],[440,2],[523.3,3],[493.9,1],[440,2],[392,3],[440,1],[392,2],[329.6,6],[440,4],[440,2],[523.3,3],[493.9,1],[440,2],[392,3],[440,1],[392,2],[329.6,6],[587.3,4],[587.3,2],[698.5,3],[587.3,1],[493.9,2],[523.3,6],[659.3,6],[523.3,3],[392,1],[329.6,2],[392,3],[349.2,1],[293.7,2],[261.6,6]],SM={},SL=138,SC=[C,C,C,C,G,G,C,C,F,F,C,C,F,C,C,C,G,G,C,C,C,G,C];
(function(){var p=0;SN.forEach(function(n){SM[p]=n[0];p+=n[1]})})();
function tickF(){var i=step%6,t=ac.currentTime+.05,c=SC[Math.floor(step/6)%23];if(i==0){c.slice(1,4).forEach(function(f){note(f/2,t,.03,2.4)});note(c[0]/4,t,.1,1.8);bell(t)}if(i==3)note(c[2]/2,t,.04,1.2);if(SM[step%SL])note(SM[step%SL],t,.1,1.8);step++}
function tick(){if(!on)return;if(mode)tickF();else tick1()}
function music(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();setInterval(tick,300)}catch(e){}}
var mb=document.getElementById("mute");
mb.onclick=function(){on=!on;mb.textContent=on?"♪ 音乐":"♪ 已静音"};

function type(i){
  if(i>=LINES.length){document.getElementById("btns").classList.add("show");return}
  var parts=LINES[i].split("|"),txt=parts[0],p=document.createElement("p");if(parts[1])p.className=parts[1];
  document.getElementById("lines").appendChild(p);var n=0;
  (function s(){p.textContent=txt.slice(0,++n);if(n<txt.length)setTimeout(s,85);else setTimeout(function(){type(i+1)},txt?650:250)})()}
document.getElementById("start").onclick=function(){this.classList.add("hide");for(var j=0;j<70;j++)sparks.push({x:W/2,y:H/2,vx:(R()-.5)*7,vy:(R()-.5)*7,l:1,r:R()*2.5+1});mb.style.opacity=1;music();
  document.getElementById("letter").classList.remove("hide");type(0)};

var tries=0,hints=["真的要再想想吗…","圣诞老人都在等你的答案呢 🎅","其实你心里已经有答案了"],maybe=document.getElementById("maybe"),yes=document.getElementById("yes");
maybe.onclick=function(){if(tries<hints.length){maybe.textContent=hints[tries];tries++;yes.style.transform="scale("+(1+tries*.12)+")"}else{maybe.textContent="好吧，我愿意 ♡";maybe.onclick=answer}};
yes.onclick=answer;
function answer(){document.getElementById("wrap").classList.add("out");mode=1;step=0;t0=performance.now();
  if(navigator.vibrate)navigator.vibrate([60,40,60]);
  setTimeout(function(){document.getElementById("fin").classList.add("show")},3800)}
</script>
</body>
</html>
